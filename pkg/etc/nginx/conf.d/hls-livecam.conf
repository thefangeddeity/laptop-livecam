server {
    listen 8080;

    # ELE Messenger shares this origin when it is installed.
    #
    # WILDCARD ON PURPOSE. A bare include of a missing file is a hard nginx
    # error, which would make this package unusable on any node without the
    # messenger; a wildcard that matches nothing is a silent no-op, so the
    # same config serves both kinds of node.
    #
    # It belongs HERE, in the package, rather than being added to the live
    # file by hand: it WAS added by hand, and installing 7.0.4 overwrote the
    # file and silently took the messenger offline (/ele and /ele-api started
    # 404ing while its service was still running happily). Whoever owns the
    # server block has to own the include.
    #
    # The messenger lives entirely under /ele, /ele-ws/ and /ele-api/, which
    # is what lets the viewer keep the ROOT of this origin -- it needs it,
    # because it fetches window.location.origin + '/hls/...'. Same arrangement
    # the other node runs on :443.
    # -mesh*, not ele-messenger*: ele-messenger 1.5 renamed its snippet to
    # ele-messenger-mesh.conf and a node that had the old name kept both, so
    # the wider wildcard declared /elem/ twice and nginx -t failed (tina,
    # 2026-11-11). The wildcard still matches nothing on a node without it.
    include snippets/ele-messenger-mesh*.conf;

    # ── SHORT PATHS ──────────────────────────────────────────────
    # Two names worth typing on a phone, one per app, so either side can
    # link to the other without anyone remembering a port.
    #   /llc  -> this camera viewer
    #   /elem -> ELE Messenger
    # /elem is declared HERE rather than in the messenger's own snippet so
    # the name exists on every node; where the messenger is not installed
    # the redirect lands on /ele and 404s, which is the honest answer.
    # `/` is a HOME, not an app. Neither the camera nor the messenger owns
    # the index, so neither one has to be the thing you land on; each lives
    # behind its own name and the index just points at both.
    location = /     { default_type text/html; try_files /home.html =404; }
    location = /llc  { default_type text/html; try_files /index.html =404; }
    # absolute_redirect off matters behind tailscale serve: nginx otherwise
    # answers with a absolute URL built from its own listen port, turning
    # https://<node>/elem into http://<node>:8080/elem/ -- a downgrade the
    # browser follows and the tailnet does not serve.
    location = /elem { absolute_redirect off; return 302 /elem/; }
    root /var/www/hls-livecam;
    index index.html;

    location = /broadcast.txt {
        etag off;
        if_modified_since off;
        add_header Last-Modified "" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type text/plain;
    }

    location = /dark.png {
        etag off;
        if_modified_since off;
        add_header Last-Modified "" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cams/cams.json {
        etag off;
        if_modified_since off;
        add_header Last-Modified "" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    location /cams {
        index cams.html;
        try_files $uri $uri/ =404;
    }

    # Both spellings, not just the bare root. `/index.html` was falling
    # through to the default static handler and being served WITH an ETag
    # and a Last-Modified, so a browser that had ever fetched that URL --
    # a phone that bookmarked it, anything following a link -- kept showing
    # a viewer we had already replaced, and the operator was looking at
    # controls that no longer existed while the server had the new page.
    location ~ ^/(index\.html)?$ {
        etag off;
        if_modified_since off;
        add_header Last-Modified "" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }
    location = /buzz.txt {
        etag off;
        if_modified_since off;
        add_header Last-Modified "" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type text/plain;
    }
    # HLS, same-origin. The viewer used to pull the stream straight from
    # mediamtx on :8888, which is fine over plain http and fatal the moment
    # the page is served over TLS: an https page may not load an http
    # stream, so the panel would come up perfectly with no picture in it.
    # Talkback forces TLS (getUserMedia refuses to run without it), so the
    # picture has to come through the same door as everything else.
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # WHIP, same-origin. The browser could talk to mediamtx on :8889
    # directly, and that works right up until the page is served over TLS --
    # then it is mixed content and the browser blocks it, which is exactly
    # the setup talkback needs, because getUserMedia refuses to run outside
    # a secure context in the first place. Proxying it here means the viewer
    # has one origin whatever it is served over.
    location /talk/ {
        proxy_pass http://127.0.0.1:8889/talk/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    # WHEP, same-origin, for the two-way INBOUND leg (roomaudio as Opus over
    # WebRTC). Same reasoning as /talk/ above: proxied here so the viewer has
    # one origin whether served over http or https, and never hits mixed
    # content against mediamtx on :8889.
    # WHEP, same-origin, for the PICTURE. mediamtx has served the camera at
    # /cam/whep on :8889 all along and nothing reached it from this origin,
    # so the viewer had no way to play it -- /talk/ and /roomaudio/ have had
    # a location for a while and the picture never got one. Same reasoning as
    # those two: one origin whether served over http or https, and never
    # mixed content against :8889.
    #
    # Longer prefix than the `location /` catch-all below, so it wins; there
    # is no static /cam/ to shadow.
    location /cam/ {
        proxy_pass http://127.0.0.1:8889/cam/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location /roomaudio/ {
        proxy_pass http://127.0.0.1:8889/roomaudio/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
